          <iframe src="{{ p.src }}" title="{{ p.name }} mobitel" style="width:390px;height:844px;border:0;border-radius:28px;background:#030815;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);outline:8px solid #111827"></iframe>
